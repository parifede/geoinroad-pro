name: Release APK

# Pubblica l'APK come release GitHub quando viene pushato un tag "v*"
# (es. v1.1.0) o avviando a mano "Run workflow" con il tag desiderato.
# Un tag con suffisso (es. v1.1.0-rc1) crea una pre-release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release (es. v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt
          pip install flet-cli==0.84.0

      - name: Test
        run: python -m unittest discover -s tests

      # flet build scarica da solo il Flutter SDK richiesto (3.41.x)
      # e il toolchain Android mancante grazie a --yes.
      # Con il secret ANDROID_SIGNING_PASSWORD l'APK viene firmato con la
      # chiave fissa in ci/upload-keystore.jks: cosi' Android accetta gli
      # aggiornamenti sopra l'app installata invece di chiedere la
      # disinstallazione (che cancella credenziali e dati).
      - name: Build APK
        env:
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          SIGN_ARGS=""
          if [ -n "$SIGNING_PASSWORD" ]; then
            SIGN_ARGS="--android-signing-key-store ci/upload-keystore.jks \
              --android-signing-key-store-password $SIGNING_PASSWORD \
              --android-signing-key-password $SIGNING_PASSWORD \
              --android-signing-key-alias upload"
            echo "Firma con chiave fissa attiva."
          else
            echo "ATTENZIONE: secret ANDROID_SIGNING_PASSWORD assente, firma debug casuale."
          fi
          flet build apk --yes --no-rich-output --skip-flutter-doctor $SIGN_ARGS

      - name: Prepara artefatto
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          cp build/apk/*.apk "dist/geoinroad-pro-${RELEASE_TAG}.apk"
          ls -lh dist

      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
