name: Release APK

# Pubblica l'APK come release GitHub quando viene pushato un tag "v*"
# (es. v1.1.0) o avviando a mano "Run workflow" con il tag desiderato.
# Un tag con suffisso (es. v1.1.0-rc1) crea una pre-release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release (es. v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt
          pip install flet-cli==0.84.0

      - name: Test
        run: python -m unittest discover -s tests

      # flet build scarica da solo il Flutter SDK richiesto (3.41.x)
      # e il toolchain Android mancante grazie a --yes.
      # Con i secret ANDROID_KEYSTORE_BASE64 (la chiave, codificata in
      # base64) e ANDROID_SIGNING_PASSWORD l'APK viene firmato sempre con la
      # stessa chiave: cosi' Android accetta gli aggiornamenti sopra l'app
      # installata invece di chiedere la disinstallazione (che cancella
      # credenziali e dati). Il repository e' pubblico, quindi la chiave
      # vive solo nei secret, mai nei file. Il percorso passato a flet
      # deve essere assoluto: uno relativo viene risolto dentro
      # build/flutter/android/app.
      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          SIGN_ARGS=""
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SIGNING_PASSWORD" ]; then
            KEYSTORE="$RUNNER_TEMP/upload-keystore.jks"
            echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$KEYSTORE"
            if ! keytool -list -keystore "$KEYSTORE" -storepass "$SIGNING_PASSWORD" -alias upload > /dev/null; then
              echo "::error::Chiave o password di firma non valide: ricontrolla i secret ANDROID_KEYSTORE_BASE64 e ANDROID_SIGNING_PASSWORD."
              exit 1
            fi
            SIGN_ARGS="--android-signing-key-store $KEYSTORE \
              --android-signing-key-store-password $SIGNING_PASSWORD \
              --android-signing-key-password $SIGNING_PASSWORD \
              --android-signing-key-alias upload"
            echo "Firma con chiave fissa attiva."
          elif [ -n "$KEYSTORE_BASE64" ] || [ -n "$SIGNING_PASSWORD" ]; then
            echo "::error::Firma incompleta: servono entrambi i secret ANDROID_KEYSTORE_BASE64 e ANDROID_SIGNING_PASSWORD."
            exit 1
          else
            echo "ATTENZIONE: secret di firma assenti, firma debug casuale."
          fi
          flet build apk --yes --no-rich-output --skip-flutter-doctor $SIGN_ARGS

      - name: Prepara artefatto
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          cp build/apk/*.apk "dist/geoinroad-pro-${RELEASE_TAG}.apk"
          ls -lh dist

      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
