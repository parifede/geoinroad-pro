[project]
name = "geoinroad-pro"
version = "1.3.0"
description = "Timelog manager per Dimetior"
dependencies = [
    "flet==0.84.0",
    "flet-webview==0.84.0",
    "flet-secure-storage==0.84.0",
]

[tool.flet]
org = "com.geoinroad"
product = "Geoinroad Pro"
company = "Geoinroad"
description = "Timelog manager per Dimetior"

[tool.flet.android]
min_sdk_version = 28
adaptive_icon_background = "#ffffff"

[tool.flet.splash]
color = "#1A1A1A"
dark_color = "#1A1A1A"

# flet-secure-storage 0.84 fissa flutter_secure_storage 10.0.0, il cui
# prompt biometrico su Android non funziona: su Android 9-10 non si apre
# (manca il pulsante "annulla" obbligatorio) e dopo un annullamento ogni
# nuovo tentativo fallisce. La 10.3.4 corregge entrambi a parita' di API.
[tool.flet.flutter.pubspec.dependency_overrides]
flutter_secure_storage = "10.3.4"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.USE_BIOMETRIC" = true
"android.permission.USE_FINGERPRINT" = true

[tool.flet.android.manifest_application]
"allowBackup" = "false"
"fullBackupContent" = "false"
